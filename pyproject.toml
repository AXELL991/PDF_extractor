[project]
name = "pdf-extractext"
version = "0.1.0"
description = "Herramienta en Python para extraer contenido de PDFs en formato Markdown y persistir en MongoDB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0.0",              # Para la extracción de contenido del PDF a Markdown
    "pymongo>=4.6.0",            # Para la conexión con la base de datos NoSQL
    "python-dotenv>=1.0.0",      # Para gestionar configuraciones vía entorno (12 Factor)
    "fastapi>=0.136.0",
    "uvicorn>=0.44.0",
    "python-multipart>=0.0.27",  # Requerido por FastAPI para el upload multipart
    "slowapi>=0.1.9",            # Rate limiting para protección contra DoS
    "bleach>=6.1.0",             # Sanitización de HTML/inputs
    "itsdangerous>=2.1.0",       # Requisito de SessionMiddleware (Starlette)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",            # Requerido por TestClient de Starlette
    "pytest>=9.0.3",
    "ruff>=0.3.0",              # Linter y formateador de código (KISS / DRY)
    "bandit[toml]>=1.7.0",      # Análisis estático de seguridad
]
