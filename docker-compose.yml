# ============================================
# SERVICIOS PDF EXTRACTOR - Docker Compose
# Arquitectura con Traefik API Gateway
# ============================================

services:
  # ----------------------------------------
  # API Gateway / Reverse Proxy: Traefik
  # ----------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: pdf-extractor-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"                           # Dashboard UI activo en :8080
      - "--providers.docker=true"                       # Lee labels de Docker
      - "--providers.docker.exposedbydefault=false"     # Solo expone contenedores con traefik.enable=true
      - "--entrypoints.web.address=:80"                 # Entrada HTTP principal
    ports:
      - "80:80"        # Entrada unificada para la API
      - "8080:8080"    # Dashboard web interactivo de Traefik
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - pdf-extractor-network

  # ----------------------------------------
  # Servicio de Base de Datos: MongoDB
  # ----------------------------------------
  mongodb:
    image: mongo:7.0 
    container_name: pdf-extractor-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: pdf_extractor_db
    volumes:
      - mongodb_data:/data/db 
    networks:
      - pdf-extractor-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ----------------------------------------
  # Servicio de la API: FastAPI (Enrutado por Traefik)
  # ----------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-extractor-api
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://admin:admin123@mongodb:27017/pdf_extractor_db?authSource=admin
      MONGO_DB_NAME: pdf_extractor_db
      ENVIRONMENT: development
      ALLOWED_HOSTS: "localhost,127.0.0.1,traefik,pdf-extractor-api,*.utn.edu.ar,pdf-extractor.utn.edu.ar"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - pdf-extractor-network
    labels:
      - "traefik.enable=true"
      # Enrutar todo el tráfico HTTP que llega por el entrypoint web a la API
      - "traefik.http.routers.api.rule=PathPrefix(`/`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ============================================
# VOLUMES (Persistencia de datos)
# ============================================
volumes:
  mongodb_data:
    driver: local

# ============================================
# NETWORKS (Comunicacion entre contenedores)
# ============================================
networks:
  pdf-extractor-network:
    driver: bridge
